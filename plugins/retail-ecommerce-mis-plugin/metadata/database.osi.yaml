version: 0.2.0.dev0
semantic_model:
- name: retail-ecommerce-mis-plugin
  description: This database provides a single source of truth for customer orders.
    The core entity is the 'orders' table, where each row represents a unique customer
    order. This table serves as a central fact table for analyzing sales, fulfillment,
    and customer behavior. There are no explicit relationships defined with other
    tables in this database.
  datasets:
  - name: '["retail-ecommerce-mis-plugin","orders"]'
    source: '"forge_demo_orders"."orders"'
    description: Each row represents a unique customer order placed in the system.
    ai_context:
      synonyms: []
      instructions: one row per unique order_id
    fields:
    - name: order_id
      description: Unique identifier.
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: '"order_id"'
      ai_context:
        synonyms: []
      custom_extensions:
      - vendor_name: FORGE
        data: '{"confidence": "low", "enum": null}'
    - name: customer_id
      description: Unique identifier.
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: '"customer_id"'
      ai_context:
        synonyms: []
      custom_extensions:
      - vendor_name: FORGE
        data: '{"confidence": "low", "enum": null}'
    - name: order_date
      description: The date when the order was placed, stored as a plain date without
        a specific time component.
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: '"order_date"'
      ai_context:
        synonyms:
        - transaction date
        - purchase date
      custom_extensions:
      - vendor_name: FORGE
        data: '{"confidence": "high", "enum": null}'
    - name: order_status
      description: The current lifecycle status of the order.
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: '"order_status"'
      ai_context:
        synonyms:
        - order lifecycle
        - fulfillment status
      custom_extensions:
      - vendor_name: FORGE
        data: '{"confidence": "high", "enum": {"cancelled": "Order was cancelled,
          no payment received.", "delivered": "Order was successfully delivered, recognized
          as revenue and a completed order.", "pending": "Order is unpaid and awaiting
          payment.", "returned": "Order was returned, fully refunded."}}'
    - name: order_total
      description: A monetary amount.
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: '"order_total"'
      ai_context:
        synonyms: []
      custom_extensions:
      - vendor_name: FORGE
        data: '{"confidence": "low", "enum": null}'
    - name: shipping_city
      description: The city where the order is to be shipped.
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: '"shipping_city"'
      ai_context:
        synonyms:
        - delivery city
      custom_extensions:
      - vendor_name: FORGE
        data: '{"confidence": "high", "enum": null}'
    - name: payment_method
      description: The method used by the customer to pay for the order.
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: '"payment_method"'
      ai_context:
        synonyms:
        - payment type
      custom_extensions:
      - vendor_name: FORGE
        data: '{"confidence": "high", "enum": null}'
    custom_extensions:
    - vendor_name: FORGE
      data: '{"role": "fact"}'
